name: t
on: { workflow_dispatch: {} }
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - name: probe models
        env: { EXAK: ${{ secrets.EXAK }} }
        run: |
          python3 - <<'PY'
          import os,json,urllib.request
          k=os.environ["EXAK"]
          def post(p,body):
              r=urllib.request.Request("https://api.exa.ai"+p,
                  data=json.dumps(body).encode(),
                  headers={"content-type":"application/json","x-api-key":k})
              try:
                  with urllib.request.urlopen(r,timeout=40) as x:
                      return x.status, x.read().decode()[:400]
              except Exception as e:
                  return getattr(e,'code',0), str(e)[:300]
          for p in ["/models","/v1/models"]:
              print(p, post(p,{}))
          s,b=post("/search",{"query":"bitcoin covenants","numResults":1})
          print("SEARCH",s,b)
          PY

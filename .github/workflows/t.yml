name: t
on:
  workflow_dispatch:
  push:
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        env:
          EXAK: ${{ secrets.EXAK }}
        run: |
          python3 -c "
import os,json,urllib.request
k=os.environ['EXAK']
def req(p,body):
    r=urllib.request.Request('https://api.exa.ai'+p,data=json.dumps(body).encode(),
        headers={'content-type':'application/json','x-api-key':k})
    try:
        with urllib.request.urlopen(r,timeout=40) as x: return x.status,x.read().decode()[:500]
    except Exception as e: return getattr(e,'code',0),str(e)[:200]
for p in ['/models','/v1/models']:
    print(p,req(p,{}))
print('SEARCH',req('/search',{'query':'bitcoin covenants','numResults':1}))
"
